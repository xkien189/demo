<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý CLB Sinh viên</title>
    <meta name="description" content="Đăng nhập vào hệ thống quản lý CLB CNTT UHL.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }

        /* ── Full-screen Bright Background ── */
        .login-bg {
            position: fixed;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            z-index: 0;
        }
        /* Bright overlay */
        .login-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.75) 0%,
                rgba(240, 246, 255, 0.55) 50%,
                rgba(224, 231, 255, 0.65) 100%
            );
            backdrop-filter: blur(4px);
        }

        /* ── Main Layout: 6:4 Split ── */
        .login-container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            width: 100%;
        }

        /* ── Left Side (60%): Branding higher & larger ── */
        .left-brand-section {
            flex: 0 0 60%;
            max-width: 60%;
            padding: 7vh 4vw 4vh 6vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-top-content {
            margin-top: 6vh;
        }

        .brand-logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .brand-logo-img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(37,99,235,0.25);
            border: 3px solid #ffffff;
            display: none;
        }
        .brand-logo-icon-box {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 2.2rem;
            box-shadow: 0 8px 24px rgba(37,99,235,0.3);
        }

        .brand-club-name {
            font-size: 3.2rem;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .brand-slogan {
            font-size: 1.35rem;
            font-weight: 500;
            color: #2563eb;
            font-style: italic;
            margin-bottom: 2.25rem;
            line-height: 1.4;
        }

        /* Social links (Facebook & TikTok) */
        .social-links-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 1.25rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            color: #1e293b;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.18);
            color: #2563eb;
            background: #ffffff;
        }
        .social-btn.facebook-btn i { color: #1877f2; font-size: 1.2rem; }
        .social-btn.tiktok-btn i { color: #000000; font-size: 1.15rem; }

        /* Left footer text */
        .brand-bottom-note {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* ── Right Side (40%): Login card shifted right ── */
        .right-login-section {
            flex: 0 0 40%;
            max-width: 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 5vw;
            padding-left: 1vw;
        }

        /* Glassmorphism Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 2.75rem 2.5rem 2.25rem;
            width: 100%;
            max-width: 410px;
            box-shadow:
                0 25px 50px -12px rgba(15, 23, 42, 0.15),
                0 10px 20px -5px rgba(15, 23, 42, 0.08);
            position: relative;
        }

        .card-header-box {
            text-align: center;
            margin-bottom: 2rem;
        }
        .card-title {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }
        .card-subtitle {
            font-size: 0.85rem;
            color: #64748b;
        }

        /* Inputs */
        .form-group-custom {
            margin-bottom: 1.25rem;
        }
        .form-group-custom label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .ico {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.05rem;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrap input {
            width: 100%;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Be Vietnam Pro', sans-serif;
            color: #0f172a;
            padding: 0.8rem 1rem 0.8rem 2.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-wrap input::placeholder { color: #cbd5e1; }
        .input-wrap input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .input-wrap:focus-within .ico { color: #2563eb; }

        .input-wrap .toggle-pass {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.2rem;
            font-size: 1.05rem;
            line-height: 1;
        }
        .input-wrap .toggle-pass:hover { color: #2563eb; }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Be Vietnam Pro', sans-serif;
            cursor: pointer;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 6px 20px rgba(37,99,235,0.35);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37,99,235,0.45);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .btn-login.success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 6px 20px rgba(16,185,129,0.35);
        }

        .card-footer-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        /* ── Responsive Mobile ── */
        @media (max-width: 900px) {
            .login-container {
                flex-direction: column;
                overflow-y: auto;
            }
            .left-brand-section {
                flex: none;
                max-width: 100%;
                padding: 2.5rem 1.5rem 1.5rem;
            }
            .brand-top-content { margin-top: 0; }
            .brand-club-name { font-size: 2.2rem; }
            .brand-slogan { font-size: 1.05rem; margin-bottom: 1.25rem; }
            .right-login-section {
                flex: none;
                max-width: 100%;
                padding: 1rem 1.5rem 3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Bright Full-screen Background -->
    <div class="login-bg"></div>

    <!-- Main Container: 6:4 Ratio -->
    <div class="login-container">

        <!-- Left Section (60%): High & Large Brand Info + TikTok/Facebook Icons -->
        <div class="left-brand-section">
            <div class="brand-top-content">
                <div class="brand-logo-badge">
                    <img src="" alt="Logo" class="brand-logo-img" id="brand-logo-img">
                    <div class="brand-logo-icon-box" id="brand-logo-icon-box">
                        <i class="bi bi-code-square"></i>
                    </div>
                </div>

                <div class="brand-club-name" id="brand-club-name">Câu lạc bộ CNTT UHL</div>
                <div class="brand-slogan" id="brand-slogan">"Tiên phong, sáng tạo, không ngừng học hỏi"</div>

                <!-- Social media links (Facebook Fanpage & TikTok) -->
                <div class="social-links-wrap">
                    <a href="https://www.facebook.com/share/17Ps6fFU2g/" target="_blank" id="btn-facebook" class="social-btn facebook-btn">
                        <i class="bi bi-facebook"></i>
                        <span>Fanpage Facebook</span>
                    </a>
                    <a href="https://www.tiktok.com/@cnttclb" target="_blank" id="btn-tiktok" class="social-btn tiktok-btn">
                        <i class="bi bi-tiktok"></i>
                        <span>Kênh TikTok</span>
                    </a>
                </div>
            </div>

            <div class="brand-bottom-note">
                <i class="bi bi-shield-check me-1"></i>Hệ thống Quản lý CLB CNTT UHL
            </div>
        </div>

        <!-- Right Section (40%): Login Box Shifted Right -->
        <div class="right-login-section">
            <div class="login-card">

                <div class="card-header-box">
                    <div class="card-title">Đăng nhập hệ thống</div>
                    <div class="card-subtitle">Nhập tài khoản được cấp để truy cập</div>
                </div>

                <!-- Login Form -->
                <form id="login-form" autocomplete="off">
                    <div class="form-group-custom">
                        <label for="username">Tên đăng nhập</label>
                        <div class="input-wrap">
                            <i class="bi bi-person ico"></i>
                            <input
                                type="text"
                                id="username"
                                placeholder="Tên đăng nhập..."
                                required
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label for="password">Mật khẩu</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock ico"></i>
                            <input
                                type="password"
                                id="password"
                                placeholder="Mật khẩu..."
                                required
                                style="padding-right: 2.8rem;"
                            >
                            <button type="button" class="toggle-pass" onclick="togglePass()">
                                <i class="bi bi-eye" id="pass-eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="btn-login">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span id="btn-text">Đăng nhập</span>
                    </button>
                </form>

                <div class="card-footer-note">
                    <i class="bi bi-lock-fill me-1"></i>Bảo mật dữ liệu nội bộ 
                </div>

            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        // Load club branding and social links from settings
        (function loadBranding() {
            try {
                const s = JSON.parse(localStorage.getItem("club_settings") || "{}");

                if (s.clubName) {
                    document.getElementById("brand-club-name").innerText = s.clubName;
                }
                if (s.slogan) {
                    document.getElementById("brand-slogan").innerText = '"' + s.slogan + '"';
                }

                // Social links
                if (s.facebookUrl) {
                    document.getElementById("btn-facebook").href = s.facebookUrl;
                }
                if (s.tiktokUrl) {
                    document.getElementById("btn-tiktok").href = s.tiktokUrl;
                }

                // Logo
                if (s.logo && s.logo.length > 20) {
                    const bImg = document.getElementById("brand-logo-img");
                    bImg.src = s.logo;
                    bImg.style.display = "block";
                    document.getElementById("brand-logo-icon-box").style.display = "none";
                }
            } catch(e) { /* keep defaults */ }
        })();

        // Toggle password
        function togglePass() {
            const inp  = document.getElementById("password");
            const icon = document.getElementById("pass-eye-icon");
            if (inp.type === "password") {
                inp.type = "text";
                icon.className = "bi bi-eye-slash";
            } else {
                inp.type = "password";
                icon.className = "bi bi-eye";
            }
        }

        // Form submit
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user   = document.getElementById("username").value.trim();
            const pass   = document.getElementById("password").value;
            const btn    = document.getElementById("btn-login");

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm" style="width:16px;height:16px;border-width:2px;"></span><span style="margin-left:8px;">Đang xác thực...</span>`;

            try {
                const loginMethod = (ClubAuth.loginAsync || ClubAuth.login).bind(ClubAuth);
                const result = await loginMethod(user, pass);

                if (result && result.success) {
                    btn.classList.add("success");
                    btn.innerHTML = `<i class="bi bi-check2-circle"></i><span>Thành công!</span>`;
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 900);
                } else {
                    btn.disabled = false;
                    btn.classList.remove("success");
                    btn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i><span>Đăng nhập</span>`;
                    
                    // Clear both inputs on login failure
                    document.getElementById("username").value = "";
                    document.getElementById("password").value = "";
                    document.getElementById("username").focus();

                    Swal.fire({
                        icon: "error",
                        title: "Đăng nhập thất bại",
                        text: (result && result.message) ? result.message : "Tên đăng nhập hoặc mật khẩu không chính xác!",
                        confirmButtonColor: "#2563eb",
                        confirmButtonText: "Thử lại"
                    });
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i><span>Đăng nhập</span>`;
                
                // Clear both inputs on error
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                document.getElementById("username").focus();
            }
        });

        // Enter key on username → focus password
        document.getElementById("username").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                document.getElementById("password").focus();
            }
        });
    </script>
</body>
</html>
