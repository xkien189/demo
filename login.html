<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý CLB Sinh viên</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    
    <style>
        body.login-body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #ffffff;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .login-header {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2.25rem 2rem 1.5rem;
            text-align: center;
        }
        
        .login-logo {
            font-size: 2.5rem;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }
        
        .login-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .login-body-content {
            padding: 2rem;
        }
        
        .role-badge-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.75rem;
            margin: 0.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .role-badge-btn:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        
        .login-body-content .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        .login-body-content .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        
        .login-body-content .form-label {
            color: #9ca3af;
        }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo"><i class="bi bi-code-square"></i></div>
            <div class="login-title">DevClub Management</div>
            <div class="text-white-50 small mt-1">Hệ thống Demo Quản lý CLB Sinh viên</div>
        </div>
        
        <div class="login-body-content">
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <div class="input-icon-group">
                        <i class="bi bi-person text-white-50"></i>
                        <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="off">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="input-icon-group">
                        <i class="bi bi-lock text-white-50"></i>
                        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Đăng nhập</button>
            </form>
            
            <div class="mt-4">
                <div class="text-white-50 small mb-2 text-center">Tài khoản Demo (Click để chọn nhanh)</div>
                <div class="d-flex flex-wrap justify-content-center">
                    <button class="role-badge-btn" onclick="fillDemo('admin')">Chủ nhiệm (admin)</button>
                    <button class="role-badge-btn" onclick="fillDemo('vice')">Phó Chủ nhiệm (vice)</button>
                    <button class="role-badge-btn" onclick="fillDemo('leader')">Trưởng ban (leader)</button>
                    <button class="role-badge-btn" onclick="fillDemo('assistant')">Phó ban (assistant)</button>
                    <button class="role-badge-btn" onclick="fillDemo('member')">Thành viên (member)</button>
                    <button class="role-badge-btn" onclick="fillDemo('guest')">Cộng tác viên (guest)</button>
                </div>
                <div class="text-center text-white-50 small mt-2">Mật khẩu chung: <code class="text-info">123</code></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        function fillDemo(username) {
            document.getElementById("username").value = username;
            document.getElementById("password").value = "123";
        }
        
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            
            const result = await ClubAuth.loginAsync(user, pass);
            if (result.success) {
                ClubUtils.showToast("Đăng nhập thành công!", "Chào mừng bạn quay trở lại.", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            } else {
                ClubUtils.showAlert("Đăng nhập thất bại", result.message, "error");
            }
        });
    </script>
</body>
</html>
