<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Thành viên - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="mb-4">
                    <a href="members.html" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0" id="form-title">Thêm thành viên mới</h5>
                    </div>
                    <div class="card-body">
                        <form id="member-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="m-id" class="form-label">Mã thành viên / Mã SV *</label>
                                    <input type="text" id="m-id" class="form-control" placeholder="Ví dụ: M008" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-name" class="form-label">Họ và tên *</label>
                                    <input type="text" id="m-name" class="form-control" placeholder="Nhập họ và tên" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-email" class="form-label">Email liên hệ *</label>
                                    <input type="email" id="m-email" class="form-control" placeholder="name@example.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-phone" class="form-label">Số điện thoại *</label>
                                    <input type="tel" id="m-phone" class="form-control" placeholder="Nhập số điện thoại" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-dept" class="form-label">Ban bộ phận *</label>
                                    <select id="m-dept" class="form-select" required>
                                        <!-- Dynamic load -->
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-role" class="form-label">Vai trò CLB *</label>
                                    <select id="m-role" class="form-select" required>
                                        <option value="admin">Chủ nhiệm (admin)</option>
                                        <option value="vice">Phó Chủ nhiệm (vice)</option>
                                        <option value="leader">Trưởng ban (leader)</option>
                                        <option value="assistant">Phó ban (assistant)</option>
                                        <option value="member" selected>Thành viên (member)</option>
                                        <option value="guest">Cộng tác viên (guest)</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-joindate" class="form-label">Ngày tham gia *</label>
                                    <input type="date" id="m-joindate" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="m-status" class="form-label">Trạng thái hoạt động</label>
                                    <select id="m-status" class="form-select">
                                        <option value="Active" selected>Hoạt động (Active)</option>
                                        <option value="Inactive">Tạm nghỉ (Inactive)</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="m-avatar" class="form-label">URL ảnh đại diện (Tùy chọn)</label>
                                    <input type="url" id="m-avatar" class="form-control" placeholder="https://images.unsplash.com/...">
                                </div>
                            </div>
                            
                            <div class="mt-4 d-flex gap-2">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu thông tin</button>
                                <a href="members.html" class="btn btn-secondary">Hủy bỏ</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/member.js"></script>
</body>
</html>
