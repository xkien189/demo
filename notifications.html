<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/table.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold">Thông báo CLB</h4>
                        <p class="text-muted small mb-0">Xem và đăng tải các bảng tin chính thức của câu lạc bộ.</p>
                    </div>
                    <div id="create-noti-area">
                        <!-- Dynamic based on role -->
                    </div>
                </div>

                <div class="row">
                    <!-- Filters List -->
                    <div class="col-lg-3 mb-4">
                        <div class="card shadow-none border">
                            <div class="card-body p-2">
                                <div class="list-group list-group-flush border-0">
                                    <button class="list-group-item list-group-item-action border-0 rounded active" id="btn-noti-all" onclick="filterNotifications('All', this)">
                                        <i class="bi bi-inbox me-2"></i>Tất cả thông báo
                                    </button>
                                    <button class="list-group-item list-group-item-action border-0 rounded" id="btn-noti-general" onclick="filterNotifications('General', this)">
                                        <i class="bi bi-globe me-2"></i>Thông báo chung
                                    </button>
                                    <button class="list-group-item list-group-item-action border-0 rounded" id="btn-noti-dept" onclick="filterNotifications('Department', this)">
                                        <i class="bi bi-building me-2"></i>Theo Ban bộ phận
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Details List -->
                    <div class="col-lg-9">
                        <div class="card shadow-none border">
                            <div class="card-body" id="notifications-list-container">
                                <!-- Dynamic notifications list -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Create Notification Modal -->
    <div class="modal fade" id="createNotiModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Đăng thông báo mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="noti-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="n-title" class="form-label">Tiêu đề thông báo *</label>
                            <input type="text" id="n-title" class="form-control" placeholder="Nhập tiêu đề thông báo" required>
                        </div>
                        <div class="mb-3">
                            <label for="n-type" class="form-label">Phân loại đối tượng *</label>
                            <select id="n-type" class="form-select" required>
                                <option value="General">Thông báo chung toàn CLB</option>
                                <option value="Department">Theo Ban bộ phận</option>
                            </select>
                        </div>
                        <div class="mb-3" id="target-dept-wrapper" style="display: none;">
                            <label for="n-target" class="form-label">Chọn Ban nhận tin *</label>
                            <select id="n-target" class="form-select">
                                <!-- Departments options dynamically injected -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="n-text" class="form-label">Nội dung thông báo *</label>
                            <textarea id="n-text" class="form-control" rows="5" placeholder="Nhập văn bản nội dung chi tiết..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="submit" class="btn btn-primary">Đăng thông báo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- AI Content Creator Modal -->
    <div class="modal fade" id="aiContentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-magic me-2"></i>✨ AI Content Assistant (Sáng tạo Nội dung CLB)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Loại nội dung cần viết *</label>
                            <select id="ai-content-type" class="form-select">
                                <option value="Bài viết Facebook Fanpage">Bài viết Facebook Fanpage</option>
                                <option value="Thông báo CLB chính thức">Thông báo CLB chính thức</option>
                                <option value="Caption đăng ảnh Sự kiện">Caption đăng ảnh Sự kiện</option>
                                <option value="Email kêu gọi Tài trợ">Email kêu gọi Tài trợ</option>
                                <option value="Kịch bản chương trình Workshop">Kịch bản chương trình Workshop</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Chủ đề / Yêu cầu chi tiết *</label>
                            <input type="text" id="ai-content-topic" class="form-control" placeholder="Ví dụ: Giới thiệu giải bóng đá CLB CNTT 2026...">
                        </div>
                    </div>

                    <div class="mb-3 text-end">
                        <button type="button" class="btn btn-primary" onclick="generateAIContent()"><i class="bi bi-lightning-charge me-1"></i>Sáng tạo ngay (Generate)</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-monospace small">Kết quả nội dung do AI khởi tạo:</label>
                        <textarea id="ai-content-result" class="form-control font-monospace" rows="8" placeholder="Kết quả bài viết sẽ hiển thị ở đây..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-outline-success" onclick="copyAIContent()"><i class="bi bi-clipboard me-1"></i>Sao chép bài</button>
                    <button type="button" class="btn btn-success" onclick="useAIContentInNoti()"><i class="bi bi-box-arrow-in-right me-1"></i>Dán vào Form Đăng thông báo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/notification.js"></script>
</body>
</html>
