<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý CLB CNTT UHL</title>
    <script>
        const userStr = sessionStorage.getItem("club_current_user");
        if (userStr) {
            try {
                const u = JSON.parse(userStr);
                if (u && ["member", "guest"].includes(u.role)) {
                    window.location.href = "workspace.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch(e) {
                window.location.href = "dashboard.html";
            }
        } else {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666;">
        Đang chuyển hướng.....
    </div>
</body>
</html>
