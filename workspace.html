<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không gian của tôi - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/table.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <!-- Welcome Title -->
                <div class="mb-4">
                    <h4 class="mb-1 fw-bold" id="ws-welcome-title">Xin chào, Thành viên!</h4>
                    <p class="text-muted small mb-0">Đây là không gian làm việc cá nhân của bạn. Xem tiến độ nhiệm vụ và điểm tích lũy của bạn tại đây.</p>
                </div>

                <!-- Personal Metrics Summary -->
                <div class="row">
                    <div class="col-xl-3 col-md-6 col-sm-12">
                        <div class="card metric-card success">
                            <div class="card-body">
                                <div class="metric-value" id="ws-score">0</div>
                                <div class="metric-label">Điểm Hoạt Động</div>
                                <i class="bi bi-award-fill metric-icon text-success"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 col-sm-12">
                        <div class="card metric-card primary">
                            <div class="card-body">
                                <div class="metric-value" id="ws-tasks-assigned">0</div>
                                <div class="metric-label">Nhiệm Vụ Được Giao</div>
                                <i class="bi bi-briefcase metric-icon text-primary"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 col-sm-12">
                        <div class="card metric-card warning">
                            <div class="card-body">
                                <div class="metric-value" id="ws-tasks-pending">0</div>
                                <div class="metric-label">Đang thực hiện</div>
                                <i class="bi bi-hourglass-split metric-icon text-warning"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6 col-sm-12">
                        <div class="card metric-card info">
                            <div class="card-body">
                                <div class="metric-value" id="ws-progress">0%</div>
                                <div class="metric-label">Tỷ lệ hoàn thành</div>
                                <i class="bi bi-percent metric-icon text-info"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Tasks Table -->
                    <div class="col-lg-8 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-transparent border-bottom">
                                <h5 class="card-title"><i class="bi bi-clipboard-check me-2"></i>Nhiệm vụ của tôi</h5>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table align-middle">
                                        <thead>
                                            <tr>
                                                <th>Nhiệm vụ</th>
                                                <th>Độ ưu tiên</th>
                                                <th>Hạn chót</th>
                                                <th>Tiến độ</th>
                                                <th>Trạng thái</th>
                                            </tr>
                                        </thead>
                                        <tbody id="ws-tasks-tbody">
                                            <!-- Dynamic -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Personal Inbox Board -->
                    <div class="col-lg-4 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-transparent border-bottom">
                                <h5 class="card-title"><i class="bi bi-envelope-paper me-2"></i>Thông báo ban bộ phận</h5>
                            </div>
                            <div class="card-body" id="ws-notifications">
                                <!-- Dynamic notifications list -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!ClubAuth.checkRouteGuard()) return;

            const user = ClubAuth.getCurrentUser();
            const member = ClubAuth.getCurrentMember();

            if (member) {
                document.getElementById("ws-welcome-title").innerText = `Không gian của ${member.name}`;
                document.getElementById("ws-score").innerText = member.activityScore || 0;

                // Load tasks
                const tasks = ClubStorage.getData("club_tasks") || [];
                const memberTasks = tasks.filter(t => t.assigneeId === member.id);

                const totalTasks = memberTasks.length;
                const completedTasks = memberTasks.filter(t => t.status === "Completed").length;
                const inProgressTasks = memberTasks.filter(t => t.status === "In Progress").length;

                const completionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                document.getElementById("ws-tasks-assigned").innerText = totalTasks;
                document.getElementById("ws-tasks-pending").innerText = inProgressTasks;
                document.getElementById("ws-progress").innerText = `${completionRate}%`;

                // Render tasks table
                const tbody = document.getElementById("ws-tasks-tbody");
                if (memberTasks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Bạn chưa được giao công việc nào</td></tr>`;
                } else {
                    tbody.innerHTML = memberTasks.map(t => {
                        let priBadge = "bg-primary";
                        if (t.priority === "High") priBadge = "bg-danger";
                        if (t.priority === "Medium") priBadge = "bg-warning";
                        
                        let statBadge = "bg-warning";
                        if (t.status === "Completed") statBadge = "bg-success";
                        if (t.status === "In Progress") statBadge = "bg-primary";

                        return `
                            <tr style="cursor: pointer;" onclick="location.href='task-detail.html?id=${t.id}'">
                                <td><strong class="text-primary">${t.title}</strong></td>
                                <td><span class="badge ${priBadge}">${t.priority}</span></td>
                                <td class="text-danger small fw-bold">${ClubUtils.formatDate(t.deadline)}</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1" style="height: 6px; width: 60px;">
                                            <div class="progress-bar bg-success" role="progressbar" style="width: ${t.progress}%"></div>
                                        </div>
                                        <span class="small">${t.progress}%</span>
                                    </div>
                                </td>
                                <td><span class="badge ${statBadge}">${t.status}</span></td>
                            </tr>
                        `;
                    }).join("");
                }

                // Render specific department notifications
                const notifications = ClubStorage.getData("club_notifications") || [];
                const deptNotifications = notifications.filter(n => 
                    n.type === "General" || 
                    (n.type === "Department" && n.target === member.department)
                );

                const notisContainer = document.getElementById("ws-notifications");
                if (deptNotifications.length === 0) {
                    notisContainer.innerHTML = `<div class="text-center text-muted py-3">Không có thông báo mới cho ban của bạn</div>`;
                } else {
                    notisContainer.innerHTML = deptNotifications.slice(0, 3).map(n => `
                        <div class="p-3 mb-2 rounded border-start border-4 border-info bg-light-info" style="background-color: var(--info-light);">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-bold small text-dark">${n.title}</span>
                                <small class="text-muted" style="font-size: 0.7rem;">${n.date}</small>
                            </div>
                            <p class="mb-0 text-secondary small text-truncate">${n.text}</p>
                        </div>
                    `).join("");
                }
            }
        });
    </script>
</body>
</html>
