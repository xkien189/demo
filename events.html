<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự kiện - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/table.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="mb-1 fw-bold">Danh sách Sự kiện</h4>
                        <p class="text-muted small mb-0">Quản lý lịch trình hoạt động, hội thảo, và các chương trình của CLB.</p>
                    </div>
                    <div id="add-event-btn-area">
                        <!-- Dynamic -->
                    </div>
                </div>

                <div class="row" id="events-grid">
                    <!-- Dynamic events -->
                </div>
            </div>
        </div>
    </div>

    <!-- Event Detail & Participants Modal -->
    <div class="modal fade" id="eventDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="e-detail-title">Tên sự kiện</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="fw-bold small text-muted text-uppercase">Thời gian</label>
                        <div class="text-dark" id="e-detail-date">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold small text-muted text-uppercase">Địa điểm</label>
                        <div class="text-dark" id="e-detail-location">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold small text-muted text-uppercase">Mô tả sự kiện</label>
                        <div class="text-dark" id="e-detail-desc">-</div>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold small text-muted text-uppercase">Thành viên phụ trách</label>
                        <div class="text-dark" id="e-detail-leader">-</div>
                    </div>
                    <div class="mb-2">
                        <label class="fw-bold small text-muted text-uppercase">Đăng ký tham gia (Giả lập)</label>
                        <div class="text-dark"><i class="bi bi-people me-1"></i><span id="e-detail-attendees">0</span> thành viên đăng ký</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div class="modal fade" id="eventEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="event-modal-title">Thêm sự kiện mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="event-edit-form">
                    <input type="hidden" id="edit-e-id">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="e-title" class="form-label">Tên sự kiện *</label>
                            <input type="text" id="e-title" class="form-control" placeholder="Nhập tên sự kiện" required>
                        </div>
                        <div class="mb-3">
                            <label for="e-date" class="form-label">Ngày tổ chức *</label>
                            <input type="date" id="e-date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="e-location" class="form-label">Địa điểm tổ chức *</label>
                            <input type="text" id="e-location" class="form-control" placeholder="Hội trường, phòng máy, link online..." required>
                        </div>
                        <div class="mb-3">
                            <label for="e-leader" class="form-label">Người phụ trách *</label>
                            <select id="e-leader" class="form-select" required>
                                <!-- Members option -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="e-desc" class="form-label">Mô tả chi tiết *</label>
                            <textarea id="e-desc" class="form-control" rows="3" placeholder="Nội dung tóm tắt sự kiện..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="e-image-file" class="form-label fw-semibold">Tải ảnh bìa sự kiện từ thiết bị</label>
                            <div class="d-flex align-items-center gap-3">
                                <img id="e-image-preview" src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600" class="rounded border" style="width: 80px; height: 60px; object-fit: cover; display: none;">
                                <div class="flex-grow-1">
                                    <input type="file" id="e-image-file" class="form-control" accept="image/*">
                                    <input type="hidden" id="e-image">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="submit" class="btn btn-primary">Lưu sự kiện</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/event.js"></script>
</body>
</html>
