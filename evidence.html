<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho minh chứng - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/table.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="mb-4">
                    <h4 class="mb-1 fw-bold">Kho minh chứng công việc</h4>
                    <p class="text-muted small mb-0">Nơi lưu trữ, tập hợp toàn bộ hồ sơ, hình ảnh, tài liệu báo cáo nghiệm thu công việc của CLB.</p>
                </div>

                <!-- Central Table -->
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Tên tài liệu / Minh chứng</th>
                                        <th>Liên kết Nhiệm vụ (Task)</th>
                                        <th>Ban liên quan</th>
                                        <th>Dung lượng</th>
                                        <th>Trạng thái công việc</th>
                                        <th class="text-end">Tải về (Giả lập)</th>
                                    </tr>
                                </thead>
                                <tbody id="evidence-tbody">
                                    <!-- Dynamic -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!ClubAuth.checkRouteGuard()) return;

            const tasks = ClubStorage.getData("club_tasks") || [];
            const tbody = document.getElementById("evidence-tbody");

            const allAttachments = [];
            tasks.forEach(t => {
                if (t.attachments && t.attachments.length > 0) {
                    t.attachments.forEach(a => {
                        allAttachments.push({
                            fileName: a.name,
                            fileSize: a.size,
                            taskTitle: t.title,
                            taskId: t.id,
                            dept: t.department,
                            taskStatus: t.status
                        });
                    });
                }
            });

            if (allAttachments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Chưa có tài liệu minh chứng nào được tải lên</td></tr>`;
                return;
            }

            tbody.innerHTML = allAttachments.map(a => {
                let statusBadge = "bg-warning";
                if (a.taskStatus === "Completed") statusBadge = "bg-success";
                if (a.taskStatus === "In Progress") statusBadge = "bg-primary";

                return `
                    <tr>
                        <td><strong class="text-dark"><i class="bi bi-file-earmark-arrow-up text-primary me-2"></i>${a.fileName}</strong></td>
                        <td><a href="task-detail.html?id=${a.taskId}" class="text-decoration-none fw-bold text-primary">${a.taskTitle}</a></td>
                        <td>${a.dept}</td>
                        <td><span class="badge bg-secondary">${a.fileSize}</span></td>
                        <td><span class="badge ${statusBadge}">${a.taskStatus}</span></td>
                        <td class="text-end">
                            <a href="#" onclick="ClubUtils.showToast('Tải xuống thành công', 'Tệp tin ${a.fileName} đã được tải về máy của bạn.', 'success'); return false;" class="btn btn-secondary btn-sm btn-icon">
                                <i class="bi bi-download"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join("");
        });
    </script>
</body>
</html>
