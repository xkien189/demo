<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch công tác - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <!-- FullCalendar CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    
    <style>
        #calendar {
            background-color: var(--bg-secondary);
            padding: 1rem;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }
        .fc-header-toolbar {
            margin-bottom: 1.5rem !important;
        }
        .fc-button-primary {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
        }
        .fc-button-primary:hover {
            background-color: var(--primary-hover) !important;
            border-color: var(--primary-hover) !important;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 1px solid var(--border-color) !important;
        }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion {
            color: var(--text-primary) !important;
            text-decoration: none !important;
        }
        .fc-col-header-cell {
            background-color: var(--bg-tertiary);
        }
        .fc-event {
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="mb-4">
                    <h4 class="mb-1 fw-bold">Lịch công tác CLB</h4>
                    <p class="text-muted small mb-0">Theo dõi thời hạn công việc (deadlines) và lịch trình sự kiện trong tháng trực quan.</p>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- FullCalendar JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!ClubAuth.checkRouteGuard()) return;

            const tasks = ClubStorage.getData("club_tasks") || [];
            const events = ClubStorage.getData("club_events") || [];

            // Map calendar items
            const fcEvents = [];

            // Add events
            events.forEach(e => {
                fcEvents.push({
                    id: e.id,
                    title: `[SK] ${e.title}`,
                    start: e.date,
                    backgroundColor: '#2563eb', // Blue
                    borderColor: '#2563eb',
                    extendedProps: { type: 'event', details: e }
                });
            });

            // Add tasks deadlines
            tasks.forEach(t => {
                let color = '#f59e0b'; // In Progress / Pending (Yellow)
                if (t.status === 'Completed') color = '#10b981'; // Green
                else if (new Date(t.deadline) < new Date()) color = '#ef4444'; // Overdue (Red)

                fcEvents.push({
                    id: t.id,
                    title: `[DL] ${t.title}`,
                    start: t.deadline,
                    backgroundColor: color,
                    borderColor: color,
                    extendedProps: { type: 'task', details: t }
                });
            });

            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'vi',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                events: fcEvents,
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    if (props.type === 'event') {
                        location.href = `events.html`; // Redirect to events section
                    } else if (props.type === 'task') {
                        location.href = `task-detail.html?id=${props.details.id}`;
                    }
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
