<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Công việc - Hệ thống Quản lý CLB Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/table.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="stylesheet" href="assets/css/button.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="topbar-container"></div>
            
            <div class="content-container fade-in">
                <div class="mb-4">
                    <a href="tasks.html" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                </div>

                <div class="row">
                    <!-- Task metrics main view -->
                    <div class="col-lg-8 mb-4">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0" id="task-title-txt">Tiêu đề công việc</h5>
                                <div id="task-action-btns"></div>
                            </div>
                            <div class="card-body">
                                <h6 class="text-muted fw-bold">Mô tả chi tiết</h6>
                                <p id="task-desc-txt" class="text-secondary" style="white-space: pre-line;">-</p>
                                
                                <hr>
                                
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="text-muted small">Ban bộ phận</div>
                                        <div class="fw-bold mt-1" id="task-dept-txt">-</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="text-muted small">Mức độ ưu tiên</div>
                                        <span class="badge mt-1" id="task-priority-badge">Medium</span>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="text-muted small">Ngày bắt đầu</div>
                                        <div class="fw-bold mt-1" id="task-start-txt">-</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="text-muted small">Hạn hoàn thành (Deadline)</div>
                                        <div class="fw-bold text-danger mt-1" id="task-deadline-txt">-</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="text-muted small">Người giao việc</div>
                                        <div class="fw-bold mt-1" id="task-creator-txt">-</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="text-muted small">Người thực hiện</div>
                                        <div class="fw-bold mt-1" id="task-assignee-txt">-</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Comments Section -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0"><i class="bi bi-chat-square-dots me-2"></i>Trao đổi thảo luận</h5>
                            </div>
                            <div class="card-body">
                                <div id="comments-container" class="mb-4" style="max-height: 300px; overflow-y: auto;">
                                    <!-- Dynamic comment threads -->
                                </div>
                                <form id="comment-form">
                                    <div class="mb-3">
                                        <textarea id="comment-textarea" class="form-control" rows="3" placeholder="Nhập ý kiến thảo luận của bạn..." required></textarea>
                                    </div>
                                    <div class="text-end">
                                        <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Gửi bình luận</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Side panels: Progress Control, Upload Proofs, History -->
                    <div class="col-lg-4">
                        <!-- Progress Card -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="card-title mb-0"><i class="bi bi-activity me-2"></i>Tiến độ & Trạng thái</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3 text-center">
                                    <div class="display-6 fw-bold text-success" id="progress-percent-txt">0%</div>
                                    <span class="badge bg-warning mt-1" id="task-status-badge">Pending</span>
                                </div>
                                
                                <form id="progress-form">
                                    <div class="mb-3">
                                        <label for="progress-slider" class="form-label">Cập nhật phần trăm (%)</label>
                                        <input type="range" class="form-range" id="progress-slider" min="0" max="100" step="5">
                                    </div>
                                    <div class="mb-3">
                                        <label for="status-select" class="form-label">Cập nhật trạng thái</label>
                                        <select id="status-select" class="form-select">
                                            <option value="Pending">Chờ xử lý (Pending)</option>
                                            <option value="In Progress">Đang thực hiện (In Progress)</option>
                                            <option value="Completed">Hoàn thành (Completed)</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100"><i class="bi bi-check2-circle"></i> Cập nhật tiến độ</button>
                                </form>
                            </div>
                        </div>

                        <!-- Proof uploads simulation -->
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5 class="card-title mb-0"><i class="bi bi-cloud-upload me-2"></i>Minh chứng công việc</h5>
                            </div>
                            <div class="card-body">
                                <div id="attachments-container" class="mb-3">
                                    <!-- List of attachments -->
                                </div>
                                <form id="upload-form">
                                    <div class="mb-3">
                                        <input type="file" id="proof-file" class="form-control" required>
                                    </div>
                                    <button type="submit" class="btn btn-secondary w-100 btn-sm"><i class="bi bi-upload"></i> Upload minh chứng</button>
                                </form>
                            </div>
                        </div>

                        <!-- History tracking logs -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0"><i class="bi bi-clock-history me-2"></i>Lịch sử cập nhật</h5>
                            </div>
                            <div class="card-body p-0" style="max-height: 250px; overflow-y: auto;">
                                <ul class="list-group list-group-flush" id="task-history-list">
                                    <!-- Dynamic logs -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/task.js"></script>
</body>
</html>
